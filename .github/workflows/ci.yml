name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee /tmp/gotest.log
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^--- FAIL:|^FAIL[[:space:]]|^panic:|signal: killed|DATA RACE|[a-zA-Z0-9_/]+\.go:[0-9]+:' /tmp/gotest.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
